<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
            rel='stylesheet'>
        <link rel="stylesheet" href="/css/contactanos.css">
        <title>Formulario de Registro e Inicio de Sesión</title>
    </head>

    <body>
        <div class="container-form register">
            <div class="information">
                <div class="info-childs">
                    <h2>Bienvenido</h2>
                    <p>Para poder recibir tu Consulta, Queja o Sugerencia. Le
                        solicitamos que rellene este Formulario.</p>
                    <input type="button" value="Volver a la Pagina de Inicio"
                        id="sign-in">
                </div>
            </div>
            <div class="form-information">
                <div class="form-information-childs">
                    <form class="form form-register" id="myForm"
                        action="/submit-form" method="post" novalidate>
                        <div class="form-grid">
                            <div>
                                <label>
                                    <i class='bx bx-user'></i>
                                    <input type="text" placeholder="Nombres"
                                        name="userName"
                                        pattern="[A-Za-záéíóúÁÉÍÓÚñÑ ]+"
                                        title="Solo se permiten letras y espacios"
                                        required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-select-multiple'></i>
                                    <select name="studentGrade" required>
                                        <option value disabled
                                            selected>Seleccione grado del
                                            estudiante</option>
                                        <option value="Inicial, 3 años">Inicial,
                                            3 años</option>
                                        <option value="Inicial, 4 años">Inicial,
                                            4 años</option>
                                        <option value="Inicial, 5 años">Inicial,
                                            5 años</option>
                                        <option
                                            value="Primaria, 1er grado">Primaria,
                                            1er grado</option>
                                        <option
                                            value="Primaria, 2do grado">Primaria,
                                            2do grado</option>
                                        <option
                                            value="Primaria, 3er grado">Primaria,
                                            3er grado</option>
                                        <option
                                            value="Primaria, 4to grado">Primaria,
                                            4to grado</option>
                                        <option
                                            value="Primaria, 5to grado">Primaria,
                                            5to grado</option>
                                        <option
                                            value="Primaria, 6to grado">Primaria,
                                            6to grado</option>
                                    </select>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-user-circle'></i>
                                    <input type="text" placeholder="Apellidos"
                                        name="userLastName"
                                        pattern="[A-Za-záéíóúÁÉÍÓÚñÑ ]+"
                                        title="Solo se permiten letras y espacios"
                                        required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-user'></i>
                                    <input type="text"
                                        placeholder="Nombre del Apoderado"
                                        name="guardianName"
                                        pattern="[A-Za-záéíóúÁÉÍÓÚñÑ ]+"
                                        title="Solo se permiten letras y espacios"
                                        required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-envelope'></i>
                                    <input type="email"
                                        placeholder="Correo Electrónico"
                                        name="userEmail" required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bxs-phone'></i>
                                    <input type="tel"
                                        placeholder="Número de Teléfono"
                                        name="phoneNumber" required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-card'></i>
                                    <select name="docType" required>
                                        <option value disabled
                                            selected>Seleccione tipo de
                                            documento</option>
                                        <option value="DNI">DNI</option>
                                        <option value="CE">Carnet de
                                            Extranjería</option>
                                    </select>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-map'></i>
                                    <input type="text" placeholder="Dirección"
                                        name="address" required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-id-card'></i>
                                    <input type="text"
                                        placeholder="Número de Documento"
                                        name="docNumber" pattern="[0-9]+"
                                        title="Solo se permiten números"
                                        required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-list-ul'></i>
                                    <select name="feedbackType" required>
                                        <option value disabled
                                            selected>Seleccione</option>
                                        <option value="Queja">Queja</option>
                                        <option
                                            value="Consulta">Consulta</option>
                                        <option
                                            value="Sugerencia">Sugerencia</option>
                                    </select>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-user'></i>
                                    <input type="text"
                                        placeholder="Nombre del Estudiante"
                                        name="studentName"
                                        pattern="[A-Za-záéíóúÁÉÍÓÚñÑ ]+"
                                        title="Solo se permiten letras y espacios"
                                        required>
                                </label>
                            </div>
                            <div>
                                <label>
                                    <i class='bx bx-message-alt-detail'></i>
                                    <textarea
                                        placeholder="Escriba su mensaje aquí"
                                        name="message" required></textarea>
                                </label>
                            </div>
                        </div>
                        <input type="submit" value="Registrarse">
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <!-- Script para manejar el evento submit del formulario -->
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('myForm');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Evitar envío automático del formulario

                // Validar el formulario usando HTML5
                if (!form.checkValidity()) {
                    // Mostrar SweetAlert2 para indicar al usuario que complete todos los campos
                    Swal.fire({
                        icon: 'error',
                        title: '¡Error!',
                        text: 'Por favor, complete todos los campos requeridos.',
                        confirmButtonText: 'Entendido'
                    });
                    return; // Detener el envío del formulario si no es válido
                }

                // Mostrar SweetAlert2 para confirmar el registro
                Swal.fire({
                    icon: 'success',
                    title: '¡Registrado!',
                    text: 'Tu registro ha sido exitoso.'
                }).then((result) => {
                    // Si el usuario confirmó el SweetAlert2
                    if (result.isConfirmed || result.isDismissed) {
                        // Enviar el formulario de manera manual
                        form.submit();
                    }
                });
            });
        });

    </script>
        <script src="/javascript/ValidacionFormulario.js"></script>
    </body>
</html>
